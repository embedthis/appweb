# appweb.conf - Minimal server configuration for Valgrind tests.

ErrorLog                error.log level=2 anew
Listen                  127.0.0.1:4150
Documents               ../web

#
#   Static files. The leak run drives /index.html repeatedly to exercise the request path.
#
AddHandler              fileHandler html gif jpeg jpg png pdf ico css js ""

#
#   CGI, so the leak check also covers a request that forks a child and pipes its output.
#   test/prep.sh stages the compiled cgiProgram as web/cgiProgram.cgi; the conditional is
#   CGI_MODULE, matching test/appweb.conf. The earlier rewrite of this file used <if CGI>, which
#   is not a conditional this build defines, so cgiHandler was never installed and fileHandler
#   served the script as a static file instead.
#
<if CGI_MODULE>
    AddHandler          cgiHandler exe cgi cgi-nph out bat cmd pl py
</if>
