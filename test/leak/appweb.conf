#
#   appweb.conf -- Configuration for testing appweb under valgrind
#
#   Rewritten 2026-08-10 (10344). The previous version was written for Appweb 4/5 and had never
#   been loaded by any release since: `DocumentRoot`, `LoadModulePath ../../../out/bin` (the build
#   tree moved to build/ long ago), and <if CGI_MODULE|EJS_MODULE|ESP_MODULE|PHP_MODULE> blocks
#   naming conditionals this build does not define. Appweb rejected it on the first directive --
#
#       error appweb config, Unknown directive "DocumentRoot". At line 8 in appweb.conf
#
#   and exited 237 before binding a port. It survived in that state because the test that uses it
#   has never run: it died earlier still, on a missing `http` client and a missing suppressions
#   file.
#
#   Keep this minimal and current. A leak test whose server never starts reports a clean heap
#   because nothing was ever allocated -- which is exactly what the first fixed run produced
#   (27 allocs, 0 leaks) before this file was repaired.
#

ErrorLog                error.log level=2 anew
Listen                  127.0.0.1:4150
Documents               ../web

#
#   Static files. The leak run drives /index.html repeatedly to exercise the request path.
#
AddHandler              fileHandler html gif jpeg jpg png pdf ico css js ""

#
#   CGI, so the leak check also covers a request that forks a child and pipes its output.
#   test/prep.sh stages the compiled cgiProgram as web/cgiProgram.cgi; the conditional is
#   CGI_MODULE, matching test/appweb.conf. The earlier rewrite of this file used <if CGI>, which
#   is not a conditional this build defines, so cgiHandler was never installed and fileHandler
#   served the script as a static file instead.
#
<if CGI_MODULE>
    AddHandler          cgiHandler exe cgi cgi-nph out bat cmd pl py
</if>
