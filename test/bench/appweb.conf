#
#   appweb.conf - Minimal benchmark configuration
#   Stripped to absolute bare minimum for maximum performance
#

# Disable logging for performance
ErrorLog stdout level=0

# HTTP and HTTPS endpoints
Listen :4200
ListenSecure :4201

# TLS Configuration
SSLCertificateFile ../../certs/test.crt
SSLCertificateKeyFile ../../certs/test.key
SSLCACertificateFile ../../certs/ca.crt

# Document root points to test files
Documents site
CanonicalName localhost:4200

# Minimal timeouts
RequestParseTimeout 60secs
InactivityTimeout 60secs
RequestTimeout 60secs

# Minimal limits for benchmarking
LimitMemory 100MB
LimitConnections 10000
LimitRequestsPerClient 10000
LimitConnectionsPerClient 10000
LimitKeepAlive 10000
LimitRequestBody 100MB
LimitRequestForm 100MB
LimitSessions 20000
LimitUpload 100MB
LimitWorkers 10

UploadDir site/upload
UploadAutoDelete on

# Essential handlers only
AddHandler fileHandler html txt json
AddHandler actionHandler

# Define users inline (username ralph, password pass5)
# authpass --cipher md5 --password password 'Test Realm' bench user
User bench 7778c87fddb3046207865e7d7a91783d user

# Digest authentication configuration for /auth routes
<Route /auth/>
    AuthType digest
    AuthDigestQop auth
    AuthRealm "Test Realm"
    Require valid-user
</Route>


# WebSocket echo route for benchmarking
<Route /test/ws>
    AddFilter webSocketFilter
    SetHandler actionHandler
    AutoFinalize off
    LimitWebSocketsMessage 10MB
    LimitWebSocketsPacket 10MB
</Route>

# Test action routes
<Route /test/>
    AddFilter uploadFilter
    SetHandler actionHandler
    LimitUpload 100MB
</Route>


# Static file routes
<Route /static/>
    AddFilter uploadFilter
    SetHandler fileHandler
</Route>

<Route /put/>
    Methods add GET PUT DELETE
    SetHandler fileHandler
</Route>

# Default route for static files
<Route />
    SetHandler fileHandler
</Route>
