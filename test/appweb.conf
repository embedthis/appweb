#
#   appweb.conf -- Appweb unit testing configuration
#
#   WARNING: Do not use this appweb.conf as a sample for your application. It configures everything big,
#   including: all handlers, filters, caching, limits, hosts and many applications. The result is a very,
#   very large single web server to test everything. Have a look at src/server/appweb.conf and use that
#   as the base for your applications. Or better still, look at samples/typical-server or samples/tiny-server.
#

ErrorLog                error.log level=4 backup=2 anew size=1MB
TraceLog                trace.log level=3 formatter=pretty

# TraceLog              trace.log level=3 size=10MB backup=5 anew
# TraceLog              stdout level=3 formatter=common format="%h %l %u %t "%r" %>s %b %n"
# TraceLog              stdout level=3 formatter=common format="{ \"time\":\"%t\", \"remoteIP\":\"%a\", \"host\":\"%V\", \"request\":\"%U\", \"query\":\"%q\", \"method\":\"%m\", \"status\":\"%>s\", \"userAgent\":\"%{User-agent}i\", \"referer\":\"%{Referer}i\" }"
# Trace                 debug=1 error=1 request=2 result=2 headers=3 context=4 packet=5 detail=6 content=10K

Listen                  :4100      # <HTTPv4>
Listen                  :4101
<if IPv6>
# Listen                [::1]:4100          # <HTTPv6>
</if>

Documents               web
CanonicalName           127.0.0.1:4100
CharSet                 utf-8

Cache                   1hour
# Cache                 client=0
# Header set Cache-Control no-cache

ExitTimeout             10secs
RequestParseTimeout     3000secs
InactivityTimeout       1000secs
RequestTimeout          200min
SessionTimeout          2000secs
Stealth                 on

MemoryPolicy            abort

# Large value for extreme unit testing 
LimitMemory             40MB
LimitCache              128K
LimitCacheItem          16K
LimitChunk              8K
LimitClients            40
LimitConnections        40
LimitConnectionsPerClient 40
LimitFiles              0
LimitKeepAlive          2000000
LimitPacket             8K
LimitProcesses          10
LimitRequestsPerClient  100
LimitRequestBody        64MB
LimitRequestForm        512K
LimitRequestHeader      32K
LimitRequestHeaderLines 64
LimitResponseBody       2GB
LimitSessions           200
LimitStreams            20
LimitUri                4K

#
#   Maximum number of worker threads in the Appweb worker pool. Must have at
#   least one. Appweb uses 2 other threads: one for the GC and one to service
#   IO events. Each worker can handle many simultaneous requests. Don't set
#   workers more than the numbers of CPU Cores Less is often more effective
#   than more workers.
#
LimitWorkers            4

#
#   Must be on before any ListenSecure directive (on by default). HTTP/1 is always on.
#
Http2                   off

#
#   If running in Xcode, need much more memory as Xcode injects libraries into the process
#
<if ME_DEBUG>
LimitMemory             200MB
LimitStreams            100
LimitClients            100
</if>

# LimitStreams                2000
# LimitRequestsPerClient      2000
# LimitConnectionsPerClient   2000

# Keep for testing global level uploads

# AddFilter           uploadFilter
# UploadDir           tmp
# UploadAutoDelete    on
# LimitUpload         1GB

#
#   Show errors to the client. WARNING: this setting is insecure, do not use in production.
#
ShowErrors              on

AddHandler              fileHandler html gif jpeg jpg png pdf ico css js txt ""

#
#   Disable streaming for all mime types and URLs. Can then enable for select routes.
#
#   StreamInput ! * /
#

<if DIR_MODULE>
    Options Indexes
    IndexOrder ascending name
    IndexOptions FancyIndexing FoldersFirst
</if>

<if UPLOAD>
<Route ^/upload/>
    # Prefix            /upload
    AddFilter           uploadFilter
    UploadDir           tmp
    UploadAutoDelete    on
    InactivityTimeout   2mins
    RequestTimeout      5mins
    LimitUpload         4GB
</Route>

#
#   Upload handler matrix. The route above is the only one the suite had, and it targets a CGI
#   program -- so every property of the upload filter was verified behind one handler and inferred
#   for the rest. These reach the same filter behind the others.
#
#   Must precede <Route ^/action/>: routes match in definition order and that one would claim this
#   path first, without the upload filter in its pipeline.
#
<Route ^/action/upload$>
    AddFilter           uploadFilter
    UploadDir           tmp
    UploadAutoDelete    on
    SetHandler          actionHandler
    LimitUpload         4GB
</Route>

#
#   The file handler cannot report what the filter staged, so this route keeps the staged file
#   instead: its survival in tmp/keep IS the evidence the upload happened. Nothing else writes
#   there, so a test can count the directory before and after.
#
<Route ^/upload-file/>
    Prefix              /upload-file
    Documents           web
    AddFilter           uploadFilter
    UploadDir           tmp/keep
    UploadAutoDelete    off
    SetHandler          fileHandler
    LimitUpload         4GB
</Route>

#
#   A deliberately small per-file cap, so the LimitUpload refusal can be tested with a few KB
#   rather than by actually writing the 4GB the routes above allow.
#
<Route ^/upload-limit/>
    Prefix              /upload-limit
    Documents           web/upload
    AddFilter           uploadFilter
    UploadDir           tmp
    UploadAutoDelete    on
    LimitUpload         2K
</Route>
</if>

#
#   Enable the action handler for simple URI to "C" bindings. This is used by the web-form Auth mech.
#
<Route ^/action/sessionCacheTest$>
    Cache server=1hour methods=POST
    AddHandler actionHandler ""
</Route>

<Route ^/action/sessionXsrfTest$>
    XSRF on
    AddHandler actionHandler ""
</Route>

<Route ^/action/>
    SetHandler actionHandler
</Route>

#
#   ESP is a separate add-on product. If installed, it serves ".esp" documents here.
#
<if ESP_MODULE>
    AddHandler espHandler esp
</if>

#
#   Web-sockets test
#
<if TEST_WEBSOCKETS_MODULE>
    <Route ^/ws/>
        Reset                   pipeline
        Documents               web
        AddFilter               webSocketFilter
        SetHandler              testWebSocketsHandler

        RequestTimeout          unlimited
        InactivityTimeout       unlimited
        LimitPacket             128K
        LimitWebSocketsMessage  40MB
        LimitWebSocketsPacket   40MB
        LimitRequestBody        unlimited
        LimitResponseBody       unlimited
    </Route>

    <Route ^/ws-limit/>
        Reset                   pipeline
        Documents               web
        AddFilter               webSocketFilter
        SetHandler              testWebSocketsHandler

        RequestTimeout          unlimited
        InactivityTimeout       unlimited
        LimitPacket             128K
        LimitWebSockets         5
        LimitWebSocketsMessage  40MB
        LimitWebSocketsPacket   40MB
        LimitRequestBody        unlimited
        LimitResponseBody       unlimited
    </Route>
</if>

#
#   WebSocket echo endpoints for the frame-level tests.
#
#   testWebSocketsHandler above answers every message with the same fixed 3K document and ignores
#   the payload, so it cannot show that a fragmented message was reassembled *correctly* -- only
#   that something arrived. These routes use the echo action instead, which is the configuration
#   test/bench/appweb.conf already drives.
#
#   Gated on WEB_SOCKETS, not TEST_WEBSOCKETS_MODULE: they need the filter, not the test handler.
#
<if WEB_SOCKETS>
    <Route ^/wsecho$>
        Reset                   pipeline
        AddFilter               webSocketFilter
        SetHandler              actionHandler
        AutoFinalize            off

        RequestTimeout          unlimited
        InactivityTimeout       unlimited
        LimitPacket             8K
        LimitWebSocketsMessage  2MB
        LimitWebSocketsPacket   64K
        LimitRequestBody        unlimited
        LimitResponseBody       unlimited
    </Route>

    #
    #   Small message and packet caps so the limit tests do not have to move megabytes to reach them.
    #
    <Route ^/wslimit$>
        Reset                   pipeline
        AddFilter               webSocketFilter
        SetHandler              actionHandler
        AutoFinalize            off

        RequestTimeout          unlimited
        InactivityTimeout       unlimited
        LimitPacket             8K
        LimitWebSocketsMessage  4K
        LimitWebSocketsPacket   1K
        LimitRequestBody        unlimited
        LimitResponseBody       unlimited
    </Route>
</if>

<if CGI_MODULE>
    #
    #   Do not copy this cgi configuration. It is insecure and used only for testing.
    #   Never serve CGI from the documents directory. See src/server/appweb.conf for how to configure CGI.
    #
    AddHandler cgiHandler exe cgi cgi-nph bat cmd pl py php
    CgiPrefix "CGI_"
    CgiEscape off
    ScriptAlias /cgi-bin/ "${HOME}/cgi-bin/" cgiHandler
    ScriptAlias /cgi/ "${DOCUMENTS}/"
    #
    #   Action maps a document's MIME type to the interpreter that runs it. cgi/action.tst.ts
    #   exercises the perl, python and php mappings; python and php are resolved from PATH by a
    #   wrapper because there is no fixed path for either that holds on macOS, on Ubuntu and in the
    #   Linux container at once -- and an Action naming a program that is not there is
    #   indistinguishable from an Action that was never consulted.
    #
    Action application/x-perl /usr/bin/perl
    Action application/x-python "${HOME}/utils/python.cgi"
    Action application/x-lua /usr/bin/lua
    Action application/x-ruby /usr/bin/ruby
    Action application/x-php "${HOME}/utils/php.cgi"

    #
    #   PHP behind the upload filter, via CGI.
    #
    #   The route deliberately does NOT carry its own "Action application/x-php". It cannot: routes
    #   share one mime table by reference (route->mimeTypes = parent->mimeTypes), so an Action inside
    #   a <Route> writes into the table every other route reads, and the last one parsed wins
    #   server-wide. This route used to repeat the mapping to defend itself from the FAST block
    #   below, which did the opposite of what the comment claimed -- the FAST block is parsed later,
    #   so ./utils/php.fast won and every .php document in the server ran through the FastCGI
    #   launcher as a CGI program, which writes nothing to stdout. That is why this route answered
    #   200 with an empty body. The FastCGI route now names its launcher on FastConnect instead, so
    #   the one global application/x-php mapping is php.cgi and nothing contends for it.
    #
    <Route ^/php-upload/>
        Prefix              /php-upload
        Documents           web/upload
        AddHandler          cgiHandler php
        AddFilter           uploadFilter
        UploadDir           tmp/keep
        UploadAutoDelete    off
        LimitUpload         4GB
    </Route>
</if>

<if FAST_MODULE>
    #
    #   To test /fast/test.php and other documents under web
    #
    <Route ^/fast/(.*)$>
        AddHandler fastHandler php
        Prefix /fast
        Documents web

        #
        #   The launcher is named here rather than by "Action application/x-php ./utils/php.fast".
        #   Action writes into the mime table every route shares, so a global Action for PHP is the
        #   whole server's mapping -- it would take the CGI routes with it. launch= is per-route and
        #   takes precedence over Action in buildFastArgs, which is what makes the two gateways able
        #   to run PHP differently in the same configuration.
        #
        #   maxRequests -- number of requests before recycling app (default unlimited)
        #   multiplex -- number of simultaneous requests to issue to a single fast proxy (default 1)
        #   timeout -- Time before pruning inactive proxies (default 5 mins)
        #   min/max -- Number of proxies to start and maintain (default 0/1)
        #   keep -- Use FastCGI keep-alive. i.e. issue subsequent requests on the same socket without reconnecting. (default true)
        #
        FastConnect 127.0.0.1 launch="${HOME}/utils/php.fast"
        Target run $1
    </Route>

    #
    #   To test /fast-bin/fastProgram and pick free TCP/IP port
    #
    <Route ^/fast-bin/(.*)$>
        AddHandler fastHandler
        Prefix /fast-bin
        Documents fast-bin

        #
        #   Program determined from the target: fast-bin/$1
        #
        FastConnect 127.0.0.1:0 launch keep min=1 max=1 maxRequests=unlimited timeout=5mins multiplex=1

        # FastConnect 127.0.0.1:9990 keep min=1 max=1 maxRequests=unlimited timeout=5mins multiplex=1
        Target run $1
    </Route>

    #
    #   The same fast program behind the upload filter, so an upload can be verified through the
    #   FastCGI gateway.
    #
    #   Unlike CGI, a FastCGI app cannot be shown the file metadata: FCGI_PARAMS records are
    #   transmitted when the request starts, which is before the upload filter has seen a byte of the
    #   body, so the FILE_<n>_* variables the var layer synthesises never reach it. What the app does
    #   receive is the urlencoded replay the filter writes in place of the multipart body -- that is
    #   the evidence the filter ran -- and the staged file itself, which is why this route keeps it.
    #
    <Route ^/fast-upload/(.*)$>
        AddHandler          fastHandler
        Prefix              /fast-upload
        Documents           fast-bin
        AddFilter           uploadFilter
        UploadDir           tmp/keep
        UploadAutoDelete    off
        LimitUpload         4GB

        FastConnect 127.0.0.1:0 launch keep min=1 max=1 maxRequests=unlimited timeout=5mins multiplex=1
        Target run $1
    </Route>
</if>

<if PROXY_MODULE>
    #
    #   For development testing
    #
    <Route ^/dproxy/(.*)$>
        Reset pipeline
        SetHandler proxyHandler
        Prefix /dproxy
        # CanonicalName https://example.com
        ErrorDocument 503 /notFound.html

        Methods add DELETE PATCH PUT OPTIONS

        ProxyConnect 127.0.0.1:9998 multiplex=unlimited timeout=1min min=0 max=1 maxRequests=unlimited ssl
        # ProxyConnect 127.0.0.1:9999 launch="${BIN_DIR}/appweb --config proxy.conf" multiplex=unlimited timeout=1min

        #
        #   Dynamically launch appweb as a proxy on 9999. Can use multiple proxy apps (max >1) on linux and load balance.
        #   maxRequests -- number of requests before recycling app (default unlimited)
        #   multiplex -- number of simultaneous requests to issue to a single proxy (default 1)
        #   timeout -- Time before pruning inactive proxies (default 5 mins)
        #   min/max -- Number of proxies to start and maintain (default 0/1)
        #   ssl -- Use SSL and ProxyConfig for the backend
        #   http2 -- HTTP/2 with SSL and ProxyConfig for the backend (prototype)
        #
        # ProxyConnect 127.0.0.1:9999 launch="${BIN_DIR}/appweb --config proxy.conf" multiplex=unlimited timeout=1min

        <ProxyConfig>
            #
            #   When used with ssl / http2. These configure the connection OUT to the backend, where
            #   Appweb is the TLS client, so the backend's certificate is verified by default. The CA
            #   file both signs the client certificate below and anchors the backend's chain.
            #
            SSLCertificateFile    "../certs/test.crt"
            SSLCertificateKeyFile "../certs/test.key"
            SSLCACertificateFile  "../certs/ca.crt"

            # SSLProtocol         ALL -SSLv2 -SSLv3 -TLSv1.0
            # SSLCipherSuite      TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            # InactivityTimeout   1min
        </ProxyConfig>

        ProxyLog proxy-debug-error.log level=3 formatter=pretty anew
        ProxyTrace debug=1 error=1 request=2 result=2 headers=3 context=4 packet=5 detail=6 content=10K
    </Route>

    #
    #   For unit tests
    #
    <Route ^/proxy/(.*)$>
        Reset pipeline
        SetHandler proxyHandler
        Prefix /proxy
        Methods add DELETE PATCH PUT OPTIONS
        InactivityTimeout 20secs

        ProxyConnect 127.0.0.1:9999 launch="${BIN_DIR}/appweb --config proxy.conf" multiplex=unlimited timeout=1min
        # ProxyConnect 127.0.0.1:9999 multiplex=unlimited timeout=1min

        ProxyLog proxy.log level=3 formatter=pretty anew
        ProxyTrace debug=1 error=1 request=2 result=2 headers=3 context=4 packet=5 detail=6 content=10K
    </Route>

    <Route ^/cached-proxy-cookie/(.*)$>
        Reset pipeline
        Prefix /cached-proxy-cookie
        Methods set GET
        Cache server=1hour methods=GET
        AddHandler proxyHandler ""

        ProxyConnect 127.0.0.1:9999 launch="${BIN_DIR}/appweb --config proxy.conf" multiplex=unlimited timeout=1min
    </Route>

    #
    #   Proxy to a backend supplied by the test itself, so a test can serve a hostile response.
    #   Nothing is launched -- security/framing-proxy starts and stops the backend on 9997.
    #
    <Route ^/badproxy/(.*)$>
        Reset pipeline
        SetHandler proxyHandler
        Prefix /badproxy
        InactivityTimeout 10secs

        ProxyConnect 127.0.0.1:9997 multiplex=unlimited timeout=20secs min=0 max=1
    </Route>
</if>

#
#   Test route pattern matching
#   The {2} means match exactly 2 of the previous character.
#
#   This is a genuine regular expression - alternation plus a character class - so it needs a
#   deployer-supplied PCRE2 library. Literal, Alias prefix, {token} segment and literal
#   alternation patterns are matched natively and need no engine, which is why the rest of this
#   file parses in a default build. Build with: premake5 --pcre2 gmake
#
<if PCRE2>
<Route ^/route/(user|admin)/{cmd}/[^a-z]\{2}(\.[hH][tT][mM][lL])$>
    Target write 200 "${cmd}"
</Route>
</if>

<Route ^/route/tokens/{cmd}$>
    Target write 200 "${cmd}-${request:query}"
</Route>

<Route ^/route/optional/{controller}(~/{action}~) >
    Target write 200 "${controller}/${action}"
</Route>

<if FAST_MODULE>
    #
    #   A negative lookahead: a genuine regular expression, so it needs PCRE2.
    #
    <if PCRE2>
    <Route ^/route/missing-ext/((?!\.php).*)$>
        Prefix /route/missing-ext
        SetHandler fastHandler
        FastConnect 127.0.0.1 launch
        Condition exists ${request:filename}
        Target run $1.php
    </Route>
    </if>
#    <Route ^/php/upload>
#        # Disable the appweb uploadFilter for php uploads
#        StreamInput multipart/form-data /php/upload
#    </Route>
</if>

