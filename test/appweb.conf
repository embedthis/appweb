#
#   Language tests
#
<Route ^/lang/root>
    Prefix /lang/root
    AddLanguageDir en english
</Route>

<Route ^/lang/suffix>
    Prefix /lang/suffix
    AddLanguageSuffix en en before
</Route>

<Route ^/lang/token/{name}$>
    Prefix /lang/token
    AddLanguageSuffix en en before
    Target write 200 "name=${name};first=$1;match=$&;path=${request:pathInfo}"
</Route>

<Route ^/lang/desync>
    Prefix /lang/desync
    Documents "${DOCUMENTS}/lang-desync"
    AddLanguageSuffix en en before
    Condition ! match ${request:pathInfo} "^/private"
</Route>

<Route ^/lang/target/(.*)(\.html)$>
    Prefix /lang/target
    AddLanguageSuffix en en
    Target run $1.${request:Language=ge}$2
</Route>

<Route ^/lang/default/(.*)(\.html)$>
    Prefix /lang/default
    AddLanguageSuffix fr fr
    DefaultLanguage fr
    Target run $1.${request:Language}$2
</Route>

<Route ^/lang/catchall>
    Prefix /lang/catchall
    AddLanguageSuffix "" en before
</Route>

#
#   Header and Param tests
#
<Route ^/route/header>
    RequestHeader User-Agent custom
    Target write 200 "${header:User-Agent}"
</Route>

<Route ^/route/param>
    Param name peter
    Target write 200 "${param:name}"
</Route>

<Route ^/cors-token>
    CrossOrigin origin=https://a.example credentials=yes
    Target write 200 "cors"
</Route>

<Route ^/cors-client>
    CrossOrigin origin=client
    Target write 200 "cors"
</Route>

<Route ^/cors-all>
    CrossOrigin origin=all
    Target write 200 "cors"
</Route>

#
#   Condition tests
#
<Route ^/route/cond>
    Condition ! match ${request:scheme} "(https|custom)"
    Target write 200 "${request:scheme}"
</Route>

#
#   Negated route pattern. Scoped by Prefix so it only applies under /route/negate, and
#   fires for anything there except /skip. A negated route with a literal pattern used to
#   match nothing at all: the startWith fast reject was applied without regard to the
#   negation, so the one path that could reach the route was then rejected by the inversion.
#
<Route !^/route/negate/skip>
    Prefix /route/negate
    Target write 200 "NEGATED-OK"
</Route>

#
#   Updates
#
<Route ^/route/update/cmd>
    Update cmd "touch route-update-cmd.tmp"
    Target write 200 "${request:error}UPDATED"
</Route>

<Route ^/route/update/auth>
    AuthType basic example.com
    Require user joshua
    Update cmd "touch route-update-auth-cmd.tmp"
    Update param from authorized
    AddLanguageSuffix en en before
    Target write 200 "${param:from}:${request:Language}"
</Route>

<Route ^/route/update/var>
    Update param from ${header:from}
    Target write 200 "${param:from}"
</Route>

#
#   Misc
#
<Route ^/compress/>
    Map compressed
</Route>

#
#   Test handler
#
#<Route ^/test>
#    Prefix /test
#    AddFilter           uploadFilter
