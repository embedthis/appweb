#    UploadAutoDelete    on
#    SetHandler test
#</Route>

#
#   Enable PUT|DELETE
#
<Route ^/tmp/>
    Documents web/tmp
    Prefix /tmp
    Methods add DELETE PUT OPTIONS
    SetHandler fileHandler
</Route>

#
#   Symbolic links under the documents directory are not followed by default. This route opts back in
#   so security/symlink.tst.ts can exercise both settings against the one document tree. Following a
#   link is permitted here, but its target must still resolve inside the documents directory.
#
<Route ^/follow/>
    Documents web
    Prefix /follow
    FollowSymlinks on
</Route>

#
#   Enable TRACE and options
#
<Route ^/trace/>
    Prefix /trace
    Methods add OPTIONS, TRACE
</Route>

#
#   Stealth mode
#
<Route ^/liberal/>
    Prefix /liberal
    Stealth off
    SessionCookie visible=true
    Header remove Content-Security-Policy
    Header remove X-Frame-Options
    Header remove X-XSS-Protection
    Header remove X-Content-Type-Options
</Route>

#
#   Sample to restrict to specific named methods
#
<Route ^/get>
   Prefix /get
   Methods set GET, OPTIONS
</Route>

#
#   Form and query echo endpoint with no handler dependency. Tests that exercise request body,
#   query-string and parameter parsing use this rather than depending on CGI or an add-on
#   handler -- ${param:...} is resolved by the native parser in http/src/var.c, so this is the
#   path everything except CGI takes. The cgi/ group covers the CGI environment separately.
#
#   Values are bracketed so an absent parameter and an empty one are distinguishable. That
#   distinction is the whole point of the valueless "?a&b&c" case. ${request:query} is the
#   undecoded original, and "Target write" HTML-escapes it -- a reflected-XSS defence that
#   basic/query.tst.ts asserts deliberately.
#
#   A route target can only name literal keys, so the set is fixed: name/address/data for the
#   form tests, a/b/c for the parsing tests.
#
<Route ^/post>
    Target write 200 "name=[${param:name}] address=[${param:address}] data=[${param:data}] a=[${param:a}] b=[${param:b}] c=[${param:c}] q=[${request:query}]"
</Route>

<Route ^/big/>
    Prefix /big
</Route>

<Route /streaming>
    Prefix /streaming
    Methods add DELETE PATCH PUT OPTIONS
    StreamInput * /
</Route>
#
#   Aliases and CGI
#
Alias /SimpleAlias "${DOCUMENTS}"
Alias /aliasDir/ ${DOCUMENTS}/alias/
Alias /aliasFile ${DOCUMENTS}/alias/atest.html
Alias /AliasDocs/ "${DOCUMENTS}/My Documents/"

<if CGI_MODULE>
    ScriptAlias /MyScripts/ "${HOME}/cgi-bin/"
    ScriptAlias /YourScripts/ "${DOCUMENTS}/"
</if>

#
#   Routes with basic, digest and form-based  authentication
#
<Route ^/auth/basic/>
    AuthType basic example.com
    <Route ^/auth/basic/executive/>
        Require role executive
    </Route>
    <Route ^/auth/basic/joshua/>
        Require user joshua
        # ErrorDocument 403 /notFound.html
    </Route>
</Route>
#
#   A client-cached, authenticated route. The shipped production configuration applies
#   "Cache client=" to .html at global scope, so an authenticated page falls under it; this route
#   reproduces that shape so the response's cacheability can be asserted. See test/basic/cache.tst.ts.
#
<Route ^/auth/cached/>
    AuthType basic example.com
    Cache client=1hour
</Route>

<Route ^/auth/blowfish/>
    AuthType basic example.com
    Require user ralph
</Route>
<Route ^/auth/blowfish-long/>
    AuthType basic "Acme Corporation Embedded Device Administration"
    Target write 200 "long blowfish"
</Route>
<Route ^/auth/digest/>
    AuthType digest example.com
    <Route ^/auth/digest/executive/>
        Require role executive
    </Route>
    <Route ^/auth/digest/joshua/>
        Require user joshua
    </Route>
</Route>

<Route ^/auth/form/>
    SessionTimeout 1mins
    # SessionCookie name="meomy" persist=false visible=true same=lax
    AuthType form example.com https:///auth/form/login.html https:///auth/form/login /auth/form/logout http:///auth/form/index.html
</Route>

#
#   Test error documents
#
<Route ^/error/>
    # Remote URIs will redirect with a 302 status code
    ErrorDocument 404 /notFound.html
</Route>

#
#   Test simple redirections
#
Redirect temp ^/old.html /index.html
Redirect 410 ^/membersOnly

<Route ^/secure-only>
    Prefix /secure-only
    # Set Strict-Transport-Security max-age and whether subDomains should be included
    Require secure age=30days domains
</Route>

<Route ^/dirlist/>
    Prefix /dirlist
</Route>

<if SSL_MODULE>
    #
    #   Define the TLS endpoint without requiring a virtual host
    #
    ListenSecure :4443       # <HTTPSv4>
    # ListenSecure :443

    SSLCACertificateFile    "../certs/ca.crt" # For client-cert verification (signed test.crt)

    #
    #   Load a test certificate signed by ca.crt
    #
    SSLCertificateFile      "../certs/test.crt"
    SSLCertificateKeyFile   "../certs/test.key"

    #
    #   TLS 1.3 preferred ciphers
    #
    # SSLCipherSuite          TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

    #
    #   TLS 1.2 preferred ciphers
    # SSLCipherSuite        ":ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:!SSLv3"

    #
    # Protocol selection only works with OpenSSL
    #
    # SSLProtocol   ALL -SSLv2 -SSLv3 -TLSv1.0
    # SSLProtocol   +TLSv1.3 +TLSv1.1 +TLSv1.2 -TLSv1.0
    # SSLProtocol   +TLSv1.3

    SSLPreload

    #
    #   Virtual hosts for SSL certificate tests
    #
    <VirtualHost *:5443 *:5444 *:5445>
        #
        #   Test multiple endpoints for a virtual host
        #   When listen is nested, it is not visible for the default host
        #
        ListenSecure 127.0.0.1:5443     # <SELFCERT>
        ListenSecure 127.0.0.1:5444     # Unused
        ListenSecure 127.0.0.1:5445     # Unused
        ServerName 127.0.0.1
        SSLCertificateFile    "../certs/self.crt"
        SSLCertificateKeyFile "../certs/self.key"
    </VirtualHost>

    #
    #   For testing SNI
    #
    <VirtualHost *:5443>
        ServerName localhost
        SSLCertificateFile    "../certs/test.crt"
        SSLCertificateKeyFile "../certs/test.key"
    </VirtualHost>

    <VirtualHost *:6443>
        ListenSecure 127.0.0.1:6443     # <CLIENTCERT>
        SSLVerifyClient on
        <Route /ssl-match>
            Prefix /ssl-match
            Condition match ${ssl:CLIENT_S_CN} "localhost|example.com"
        </Route>
        # Condition match ${ssl:state} "CN=localhost,"
    </VirtualHost>

    <VirtualHost *:7443>
        ListenSecure 127.0.0.1:7443     # <TESTCERT>
        SSLVerifyClient on
    </VirtualHost>

    #
    #   Certificate revocation endpoints, generated with their PKI by test/utils/make-pki.sh.
    #   Matched with a glob so a tree without that PKI simply has no revocation endpoints.
    #
    Include pki/*.conf
</if>

<VirtualHost *:4200>
    Listen 127.0.0.1:4200               # <NAMED>
    ServerName  localhost:4200
    Documents   "${HOME}/web/vhost/namehost1"
</VirtualHost>

#
#   A ServerName beginning with "/" is a regular expression, so it needs PCRE2. Exact,
#   "*.name" (starts-with) and "*name" (contains) forms are matched natively.
#
<if PCRE2>
<VirtualHost *:4200>
    ServerName  /embedthis/
    CanonicalName localhost:4200
    Documents   web
</VirtualHost>
</if>

<VirtualHost *:4200>
    ServerName 127.0.0.1:4200
    Documents "${HOME}/web/vhost/namehost2"
    Reset pipeline
    AddHandler fileHandler html gif jpeg jpg png pdf ico css js ""
</VirtualHost>

#
#   IP virtual host
#
<VirtualHost *:4300>
    Listen 127.0.0.1:4300             # <IPHOST>
    Documents "${HOME}/web/vhost/iphost"
    AuthType basic example.com
    Require user mary
</VirtualHost>

#
#   Virtual host for CrossOrigin
#
<VirtualHost *:4400>
    Listen 127.0.0.1:4400
    Documents web
</VirtualHost>

