ErrorLog                proxy-app-error.log level=3
TraceLog                proxy-app-trace.log level=3 formatter=pretty
Listen                  :9999 multiple
Documents               web
RequestParseTimeout     30secs
InactivityTimeout       5mins
RequestTimeout          2mins
Http2                   on
# CanonicalName           127.0.0.1:9998

ListenSecure            :9998 multiple
SSLCACertificateFile    "../certs/ca.crt" # For client-cert verification (signed test.crt)
SSLCertificateFile      "../certs/test.crt"
SSLCertificateKeyFile   "../certs/test.key"

<if CGI_MODULE>
AddHandler              cgiHandler exe cgi cgi-nph bat cmd pl py
CgiPrefix               "CGI_"
CgiEscape               off
ScriptAlias             /cgi-bin/ "${HOME}/cgi-bin/" cgiHandler
</if>

#
#   ESP is a separate add-on product. If installed, it serves ".esp" documents here.
#
<if ESP_MODULE>
AddHandler              espHandler esp
</if>

ShowErrors              on

#
#   Web-sockets backend for the proxy WebSocket tests
#
<if TEST_WEBSOCKETS_MODULE>
    <Route ^/ws/>
        Reset                   pipeline
        Documents               web
        AddFilter               webSocketFilter
        SetHandler              testWebSocketsHandler

        RequestTimeout          unlimited
        InactivityTimeout       unlimited
        LimitWebSocketsMessage  40MB
        LimitWebSocketsPacket   40MB
        LimitRequestBody        unlimited
        LimitResponseBody       unlimited
    </Route>
</if>

#
#   Form echo endpoint with no handler dependency. Backend for the proxy POST tests.
#
#
#   Must mirror the /post echo route in appweb.conf -- proxy/post.tst.ts asserts the same
#   bracketed contract through the proxy that basic/post.tst.ts asserts directly.
#
<Route ^/post>
    Target write 200 "name=[${param:name}] address=[${param:address}] data=[${param:data}] a=[${param:a}] b=[${param:b}] c=[${param:c}] q=[${request:query}]"
</Route>

<Route ^/proxy-cache-cookie/(.*)$>
    Header set Set-Cookie "backend-session=from-backend; Path=/; HttpOnly"
    Target write 200 "cacheable proxy body"
</Route>

AddHandler              fileHandler html gif jpeg jpg png pdf ico css js txt ""

AddFilter               uploadFilter
UploadDir               tmp
UploadAutoDelete        on

<Route ^/upload>
    UploadDir           tmp
    UploadAutoDelete    on
</Route>

<Route ^/tmp/>
    Documents web/tmp
    Prefix /tmp
    Methods add DELETE PUT OPTIONS
    SetHandler fileHandler
</Route>

