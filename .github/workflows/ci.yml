name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev libfcgi-dev
          # aws/tap is pre-tapped on GitHub's macOS runners and is untrusted under Homebrew's tap-trust
          # policy, so every brew invocation prints a nine-line warning about it. Nothing here uses it --
          # fcgi and openssl are homebrew/core, which is trusted -- so drop the tap rather than silencing
          # the check with HOMEBREW_NO_REQUIRE_TAP_TRUST. A warning nobody can act on is a warning
          # everybody learns to scroll past, and the next one may matter.
          - os: macos-latest
            install-deps: brew untap aws/tap >/dev/null 2>&1 || true; brew update && brew install fcgi openssl
          - os: windows-latest
            install-deps: echo "Windows dependencies are prepared by projects\\openssl-prep.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          #   make check-sbom compares the vendored paks with the last release tag
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system dependencies
        shell: bash
        run: |
          if [ -z '${{ matrix.install-deps }}' ]; then
            echo "No dependency install command configured for ${{ matrix.os }}" >&2
            exit 1
          fi
          ${{ matrix.install-deps }}

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add Bun to PATH (Windows)
        run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      # Install the lockfile's exact tools without lifecycle scripts, then run TestMe's trusted installer explicitly.
      - name: Install TestMe
        run: |
          bun install --frozen-lockfile

      - name: Build and install tm
        working-directory: node_modules/@embedthis/testme
        run: |
          bun bin/postinstall.mjs

      - name: Verify TestMe installation (Unix)
        if: runner.os != 'Windows'
        run: |
          tm --version

      - name: Verify TestMe installation (Windows)
        if: runner.os == 'Windows'
        run: |
          tm.exe --version
          # Get-ChildItem -Recurse -Path "C:\Program Files\OpenSSL"

      #
      #   Every platform builds warning-free and fails on any new compiler warning.
      #
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          make SHOW=1 CFLAGS=-Werror

# Build through make.bat using the release configuration plus test handlers.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          make.bat test /v:normal /warnaserror

      #
      #   dist/ is generated from src/ but committed, because it is the payload of the published
      #   appweb pak and it ships in the source archive. Fail if a source change.
      #
      #
      #   Only in a tree that carries the amalgamation script. The published source distribution does
      #   not ship bin/buildLib.sh, so there "make check-dist" prints [Skip] and exits 0 -- this step
      #   passed downstream without checking anything, which is worse than not running it. Condition on
      #   the script so the step reports as skipped there rather than as a green gate.
      #
      - name: Verify dist/ is in sync with src/
        if: matrix.os == 'ubuntu-latest' && hashFiles('bin/buildLib.sh') != ''
        run: |
          make check-dist

      # Scan staged archive contents for internal references; skip without packaging scripts.
      - name: Verify the source archive carries no internal references
        if: matrix.os == 'ubuntu-latest' && hashFiles('bin/buildLib.sh') != ''
        run: |
          make check-archive

      # Verify vendored files against src/vendor.sha256 without requiring local paks.
      - name: Verify vendored pak files
        if: matrix.os == 'ubuntu-latest'
        run: |
          make verify

      #
      #   The SBOM must agree with package.json, bun.lock, src/vendor.sha256 and premake5.lua. The public
      #   source distribution carries no doc/compliance, so the step is skipped there.
      #
      - name: Verify the SBOM agrees with the tree
        if: matrix.os == 'ubuntu-latest' && hashFiles('doc/compliance/sbom/sbom.json') != ''
        run: |
          make check-sbom

      # Reject CA bundles older than 180 days; refresh via make roots in certs.
      - name: CA bundle freshness
        if: matrix.os == 'ubuntu-latest'
        run: |
          snap=$(sed -n 's/^## Certificate data from Mozilla as of: //p' certs/roots.crt)
          age=$(( ($(date +%s) - $(date -d "$snap" +%s)) / 86400 ))
          echo "certs/roots.crt is $age days old ($snap)"
          test "$age" -lt 180

      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        run: |
          make test

      #
      #   Re-enabled once the Windows suite passed: 159 passed, 0 failed of 183 with 1297/1297
      #   assertions, twice.
      #
      #   Through windows.bat rather than openssl-prep.bat alone: TestMe compiles the .tst.c tests
      #   with cl.exe, so the step needs the whole VC environment and not just msbuild on PATH.
      #   windows.bat sources vcvarsall and then openssl-prep, selecting the x64 toolchain the
      #   solution targets whatever the host architecture is, so it and the build step above agree.
      #
      #   The suite needs openssl and sh on PATH -- the ssl group drives "openssl s_client", and the
      #   hdrtest CGI fixture runs through sh. Both ship with the runner image; if this step fails to
      #   find either, add them to PATH here rather than reverting to "if: false".
      #
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\windows.bat cmd /c "cd test && tm"

      #
      #   A server that will not start is reported by the runner as an exit code and nothing else,
      #   and test/cleanup.sh deletes the logs on its way out. setup.sh copies its diagnosis under
      #   tmp/, which cleanup.sh does not touch; print whatever survived.
      #
      - name: Show test diagnostics
        if: failure()
        shell: bash
        run: |
          for f in test/tmp/setup-failure.txt test/appweb.log test/error.log ; do
            if [ -s "$f" ] ; then echo "===== $f" ; cat "$f" ; fi
          done
          echo "===== done"

      # Attach server logs retained after failures; download with gh run download.
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-logs-${{ runner.os }}
          path: test/tmp/server-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Run the functional suite under ASan/UBSan; fail on reports. See bin/sanitize.sh for MPR heap checks.
  sanitize:
    name: Sanitizers on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev libfcgi-dev

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install TestMe
        run: |
          bun install --frozen-lockfile

      - name: Build and install tm
        working-directory: node_modules/@embedthis/testme
        run: |
          bun bin/postinstall.mjs

      - name: Run the suite under ASan and UBSan
        env:
          SANITIZE_SYMBOLIZE: '0'
        run: |
          make test-asan

      - name: Upload sanitizer reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizer-reports
          path: |
            test/tmp/sanitizer/
            test/tmp/server-logs/
          if-no-files-found: ignore
          retention-days: 14
